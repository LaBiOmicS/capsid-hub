name: samtools
version: '1.19'
description: Tools for dealing with SAM, BAM and CRAM files
homepage: https://github.com/samtools/samtools
license: MIT
categories:
- bioinformatics
- bioconda-migrated
# bioconda has no linux-aarch64 build of samtools 1.19
platforms:
- linux/amd64
build:
  type: pixi-conda
  python_version: '3.12'
  conda_packages:
  - samtools==1.19
  channels:
  - conda-forge
  - bioconda
  configure_args: []
  cmake_args: []
  build_commands: []
  dependencies:
    build: []
    run: []
  env: {}
test:
  command: samtools --help
  expected_exit_code: 0
labels: {}
