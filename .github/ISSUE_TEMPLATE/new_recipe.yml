name: 🧬 New Recipe Submission
description: Submit a new bioinformatics tool or version to Capsid Hub without using Git
title: "Recipe: [Tool Name] [Version]"
labels: ["new-recipe"]
body:
  - type: markdown
    attributes:
      value: |
        ### Welcome to Capsid Hub!
        Submit your container recipe here. The **Capsid Bot** will automatically audit, build, and test your container.
  - type: input
    id: tool_name
    attributes:
      label: Tool Name
      description: Lowercase name of the software (e.g. `samtools`, `cutadapt`, `star`)
      placeholder: "e.g. samtools"
    validations:
      required: true
  - type: input
    id: tool_version
    attributes:
      label: Version
      description: Semantic version (e.g. `1.25`, `2.7.11b`)
      placeholder: "e.g. 1.25"
    validations:
      required: true
  - type: textarea
    id: recipe_yaml
    attributes:
      label: Recipe YAML Content
      description: Paste the content of your `recipe.yaml` generated by `capsid init`
      render: yaml
    validations:
      required: true
