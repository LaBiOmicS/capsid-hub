name: Capsid Hub PR Audit & Validation

on:
  pull_request:
    paths:
      - 'recipes/**'
      - 'stacks/**'
      - 'schema/**'

env:
  # Capsid engine version used by CI (commit SHA of LaBiOmicS/capsid)
  CAPSID_REF: a98615e8d85e89e446dc39e48029e8a002079ab5

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Capsid CLI
        run: uv tool install "git+https://github.com/LaBiOmicS/capsid.git@${CAPSID_REF}"

      - name: JSON Schema is up to date
        run: capsid schema --out-dir schema --check

      - name: Detect changed recipes and stacks
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" HEAD)
          recipes=$(echo "$changed" | grep -E '^recipes/[^/]+/[^/]+/' | cut -d/ -f1-3 | sort -u \
                    | while read -r d; do [ -f "$d/recipe.yaml" ] && echo "$d/recipe.yaml"; done || true)
          stacks=$(echo "$changed" | grep -E '^stacks/[^/]+$' | sed -E 's/\.(pixi|requirements)\.lock$/.yaml/' \
                   | sort -u | while read -r f; do [ -f "$f" ] && echo "$f"; done || true)
          ok='^(recipes/[a-z0-9._-]+/[A-Za-z0-9._+-]+/recipe\.yaml|stacks/[a-z0-9._-]+\.yaml)$'
          for f in $recipes $stacks; do [[ "$f" =~ $ok ]] || { echo "::error::unexpected path $f"; exit 1; }; done
          echo "recipes=$(tr '\n' ' ' <<< "$recipes")" >> "$GITHUB_OUTPUT"
          echo "stacks=$(tr '\n' ' ' <<< "$stacks")" >> "$GITHUB_OUTPUT"
          echo "Recipes: $recipes"; echo "Stacks: $stacks"

      - name: Security & schema audit (lint)
        env:
          TARGETS: ${{ steps.changed.outputs.recipes }} ${{ steps.changed.outputs.stacks }}
        run: |
          for file in $TARGETS; do
            echo "::group::Auditing $file"
            capsid lint "$file" --catalog catalog.json
            echo "::endgroup::"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & test changed containers
        env:
          TARGETS: ${{ steps.changed.outputs.recipes }} ${{ steps.changed.outputs.stacks }}
        run: |
          for file in $TARGETS; do
            echo "::group::Building and testing $file"
            capsid build "$file" --test
            echo "::endgroup::"
          done

      # Fork PRs get a read-only token: the comment is best effort, the checks above are the gate
      - name: Post approval status comment
        if: success()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGETS: ${{ steps.changed.outputs.recipes }} ${{ steps.changed.outputs.stacks }}
        with:
          script: |
            const changed = process.env.TARGETS.split(/\s+/).filter(Boolean);
            let body = "### 🧬 Capsid Bot: Recipe Verification Passed! 🎉\n\n";
            body += "| File | Status | Security Audit | Automated Test |\n";
            body += "| :--- | :--- | :--- | :--- |\n";
            for (const file of changed) {
              body += `| \`${file}\` | ✔ Approved | ✔ Hardened Non-Root & Tini | ✔ Exit Code 0 |\n`;
            }
            body += "\n*This PR is compliant with Capsid security policies and ready for maintainer merge.*";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
