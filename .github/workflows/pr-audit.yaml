name: Capsid Hub PR Audit & Validation

on:
  pull_request:
    paths:
      - 'recipes/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Capsid CLI
        run: |
          uv tool install git+https://github.com/capsid/capsid.git

      - name: Detect Changed Recipes
        id: changed-recipes
        run: |
          # Any change in a recipe directory (recipe.yaml or its lockfiles) re-audits that recipe
          CHANGED=$(git diff --name-only origin/main HEAD | grep -E '^recipes/[^/]+/[^/]+/' | cut -d/ -f1-3 | sort -u \
            | while read -r d; do [ -f "$d/recipe.yaml" ] && echo "$d/recipe.yaml"; done | tr '\n' ' ' || true)
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed recipes detected:"
          echo "$CHANGED"

      - name: Security & Schema Audit (Lint)
        run: |
          for file in ${{ steps.changed-recipes.outputs.files }}; do
            echo "::group::Auditing $file"
            capsid lint "$file" --catalog catalog.json
            echo "::endgroup::"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Test Changed Containers
        run: |
          for file in ${{ steps.changed-recipes.outputs.files }}; do
            echo "::group::Building and testing $file"
            capsid build "$file" --test
            echo "::endgroup::"
          done

      - name: Post Approval Status Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changed = "${{ steps.changed-recipes.outputs.files }}".split(/\s+/).filter(Boolean);
            let body = "### 🧬 Capsid Bot: Recipe Verification Passed! 🎉\n\n";
            body += "| Recipe File | Status | Security Audit | Automated Test |\n";
            body += "| :--- | :--- | :--- | :--- |\n";
            for (const file of changed) {
              body += `| \`${file}\` | ✔ Approved | ✔ Hardened Non-Root & Tini | ✔ Exit Code 0 |\n`;
            }
            body += "\n*This PR is compliant with Capsid security policies and ready for maintainer merge.*";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
