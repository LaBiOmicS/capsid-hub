name: 🤖 Friday Capsid Robot (Bioconda & BioContainers Harvester)

on:
  schedule:
    # Runs every Friday at 04:00 UTC
    - cron: '0 4 * * 5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '7'
      limit:
        description: 'Maximum number of tools to ingest'
        required: false
        default: '10'
      dry_run:
        description: 'Simulate without creating Pull Request'
        type: boolean
        required: false
        default: false

env:
  # Capsid engine version used by CI (commit SHA of LaBiOmicS/capsid)
  CAPSID_REF: a98615e8d85e89e446dc39e48029e8a002079ab5

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Capsid Hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚡ Set up uv & Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: ⚙️ Install Capsid CLI Engine
        run: |
          uv tool install "git+https://github.com/LaBiOmicS/capsid.git@${CAPSID_REF}"

      - name: 🤖 Run Capsid Robot Harvester
        id: run_bot
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ && "$LIMIT" =~ ^[0-9]+$ ]] || { echo "::error::days/limit must be integers"; exit 1; }

          echo "Running Capsid Robot with lookback $DAYS days and limit $LIMIT tools..."
          capsid bot sync \
            --days "$DAYS" \
            --limit "$LIMIT" \
            --recipes-dir recipes \
            --catalog catalog.json \
            --report pr-report.md \
            ${DRY_RUN:+"$DRY_RUN"}

      - name: 🛡️ Audit & Lint Community Recipes
        run: |
          capsid lint recipes/

      - name: 📚 Update Web Catalog and Documentation
        run: |
          capsid catalog --dir recipes/ --out catalog.json
          capsid docs --dir recipes/ --catalog catalog.json --out-dir .

      - name: 🔍 Check for New Recipes
        id: git_status
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain recipes/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Open Pull Request with New Recipes
        if: steps.git_status.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(robot): ingest latest tools from Bioconda and BioContainers"
          branch: "robot/upstream-sync"
          delete-branch: true
          title: "🤖 Weekly Ingest: New Tools & Updates from Bioconda / BioContainers"
          body-path: pr-report.md
          labels: |
            robot
            automated-ingest
            bioconda
            biocontainers
          draft: false
