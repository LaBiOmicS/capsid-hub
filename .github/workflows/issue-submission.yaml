name: Convert Web Issue to Pull Request

# Issue content is untrusted. The recipe is extracted and built WITHOUT write permissions;
# only the final job (which never executes recipe content) gets a write token to open the PR.

on:
  issues:
    types: [opened]

env:
  # Capsid engine version used by CI (commit SHA of LaBiOmicS/capsid)
  CAPSID_REF: a98615e8d85e89e446dc39e48029e8a002079ab5

permissions:
  contents: read

jobs:
  extract:
    if: contains(github.event.issue.labels.*.name, 'new-recipe')
    runs-on: ubuntu-latest
    outputs:
      tool: ${{ steps.extract.outputs.tool }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract recipe from issue
        id: extract
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || "";
            const match = body.match(/```(?:yaml)?\s*([\s\S]*?)```/);
            if (!match) { core.setFailed("No YAML block found in issue body."); return; }
            const yamlContent = match[1].trim() + "\n";
            const name = yamlContent.match(/^name:\s*['"]?([^'"\s]+)['"]?\s*$/m);
            const ver = yamlContent.match(/^version:\s*['"]?([^'"\s]+)['"]?\s*$/m);
            // Strict allow-lists: these values become paths, branch names and image tags
            if (!name || !/^[a-z0-9][a-z0-9._-]{0,63}$/.test(name[1].toLowerCase())) {
              core.setFailed("Tool name must match ^[a-z0-9][a-z0-9._-]*$"); return;
            }
            if (!ver || !/^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$/.test(ver[1])) {
              core.setFailed("Version must match ^[A-Za-z0-9][A-Za-z0-9._+-]*$"); return;
            }
            fs.mkdirSync('submission', { recursive: true });
            fs.writeFileSync('submission/recipe.yaml', yamlContent);
            core.setOutput('tool', name[1].toLowerCase());
            core.setOutput('version', ver[1]);

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submission
          path: submission/recipe.yaml

  build:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission
          path: submission

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Capsid CLI
        run: uv tool install "git+https://github.com/LaBiOmicS/capsid.git@${CAPSID_REF}"

      # Lint and build at the final location: the linter checks that name and version match the path
      - name: Place recipe
        id: place
        env:
          TOOL: ${{ needs.extract.outputs.tool }}
          VERSION: ${{ needs.extract.outputs.version }}
        run: |
          mkdir -p "recipes/$TOOL/$VERSION"
          mv submission/recipe.yaml "recipes/$TOOL/$VERSION/recipe.yaml"
          echo "recipe=recipes/$TOOL/$VERSION/recipe.yaml" >> "$GITHUB_OUTPUT"

      - name: Security & integrity audit
        env:
          RECIPE: ${{ steps.place.outputs.recipe }}
        run: capsid lint "$RECIPE" --catalog catalog.json

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build & test the container
        env:
          RECIPE: ${{ steps.place.outputs.recipe }}
        run: capsid build "$RECIPE" --test

  open-pr:
    needs: [extract, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission
          path: submission

      - name: Place recipe
        env:
          TOOL: ${{ needs.extract.outputs.tool }}
          VERSION: ${{ needs.extract.outputs.version }}
        run: |
          mkdir -p "recipes/$TOOL/$VERSION"
          mv submission/recipe.yaml "recipes/$TOOL/$VERSION/recipe.yaml"
          rm -rf submission

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(recipe): add ${{ needs.extract.outputs.tool }} ${{ needs.extract.outputs.version }} from issue #${{ github.event.issue.number }}"
          branch: "issue-${{ github.event.issue.number }}"
          title: "feat(recipe): add ${{ needs.extract.outputs.tool }} ${{ needs.extract.outputs.version }}"
          body: |
            Closes #${{ github.event.issue.number }}

            Submitted by @${{ github.event.issue.user.login }} via the web form.
            - **Tool:** `${{ needs.extract.outputs.tool }}`
            - **Version:** `${{ needs.extract.outputs.version }}`
            - **Audit / build / test:** passed in an unprivileged job

            Lockfiles are not generated from issues: run `capsid lock` before merging.
