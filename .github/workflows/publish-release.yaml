name: Capsid Hub Container Publisher

# Publishes every changed recipe/stack as a multi-arch image (linux/amd64 + linux/arm64 when the
# recipe supports it), signs it with Cosign (keyless, GitHub OIDC), attaches an SPDX SBOM and a
# SLSA build-provenance attestation, then pulls the signed digest on a native arm64 runner and
# runs the recipe test there.

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'stacks/**'
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated recipe.yaml / stack .yaml paths, or 'all'"
        required: true
        default: 'all'

env:
  # Must match capsid/project.py REGISTRY
  REGISTRY: ghcr.io/labiomics/capsid
  # Capsid engine version used by CI (commit SHA of LaBiOmicS/capsid)
  CAPSID_REF: a98615e8d85e89e446dc39e48029e8a002079ab5

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select targets
        id: targets
        env:
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_TARGETS" = "all" ]; then
            files=$(ls recipes/*/*/recipe.yaml stacks/*.yaml)
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            files=$(tr -s ' ' '\n' <<< "$INPUT_TARGETS")
          else
            # A change to a recipe dir (recipe.yaml or lockfiles) republishes that recipe;
            # a change to stacks/<name>.* republishes that stack
            changed=$(git diff --name-only HEAD~1 HEAD)
            files=$( { echo "$changed" | grep -E '^recipes/[^/]+/[^/]+/' | cut -d/ -f1-3 | sort -u \
                         | while read -r d; do [ -f "$d/recipe.yaml" ] && echo "$d/recipe.yaml"; done
                       echo "$changed" | grep -E '^stacks/[^/]+$' | sed -E 's/\.(pixi|requirements)\.lock$/.yaml/' \
                         | sort -u | while read -r f; do [ -f "$f" ] && echo "$f"; done
                     } || true)
          fi
          # Only well-formed paths (they end up in image names and shell commands)
          json=$(printf '%s\n' "$files" | grep -E '^(recipes/[a-z0-9._-]+/[A-Za-z0-9._+-]+/recipe\.yaml|stacks/[a-z0-9._-]+\.yaml)$' \
                 | jq -R . | jq -cs .)
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "Targets: $json"

  publish:
    needs: detect
    if: needs.detect.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # Cosign keyless signing + attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Capsid CLI
        run: uv tool install "git+https://github.com/LaBiOmicS/capsid.git@${CAPSID_REF}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == stacks/* ]]; then
            NAME=$(sed -nE "s/^name:[[:space:]]*['\"]?([^'\" ]+)['\"]?[[:space:]]*$/\1/p" "$TARGET")
            VER=$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\" ]+)['\"]?[[:space:]]*$/\1/p" "$TARGET")
          else
            NAME=$(basename "$(dirname "$(dirname "$TARGET")")"); VER=$(basename "$(dirname "$TARGET")")
          fi
          NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${REGISTRY}/${NAME}:${VER}" >> "$GITHUB_OUTPUT"

      # Build -> test (host arch) -> rebuild all platforms and push (rewrite-timestamp)
      - name: Build, test and push
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ steps.name.outputs.tag }}
        run: capsid build "$TARGET" --tag "$TAG" --push

      - name: Resolve pushed digest
        id: digest
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Digest}}' | jq -r .)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$TAG"

      - name: Sign (Cosign keyless)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.digest.outputs.digest }}
        run: cosign sign --yes --recursive "$REF"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.digest.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # Pull the signed image on a native arm64 runner and run the recipe test there
  verify:
    needs: [detect, publish]
    if: needs.detect.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.targets) }}
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Capsid CLI
        run: uv tool install "git+https://github.com/LaBiOmicS/capsid.git@${CAPSID_REF}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signature and run the test on this architecture
        env:
          TARGET: ${{ matrix.target }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == stacks/* ]]; then
            NAME=$(sed -nE "s/^name:[[:space:]]*['\"]?([^'\" ]+)['\"]?[[:space:]]*$/\1/p" "$TARGET")
            VER=$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\" ]+)['\"]?[[:space:]]*$/\1/p" "$TARGET")
          else
            NAME=$(basename "$(dirname "$(dirname "$TARGET")")"); VER=$(basename "$(dirname "$TARGET")")
          fi
          IMAGE="${REGISTRY}/$(echo "$NAME" | tr '[:upper:]' '[:lower:]')"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VER" --format '{{json .Manifest.Digest}}' | jq -r .)
          ARCH=$(docker version --format '{{.Server.Arch}}')
          if ! docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -e --arg a "$ARCH" \
                 '[.manifests[]?.platform.architecture] | index($a)' >/dev/null; then
            echo "::notice::$TARGET is not published for linux/$ARCH (recipe platforms); skipping"
            exit 0
          fi
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "^https://github.com/${REPO}/\.github/workflows/publish-release\.yaml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "✔ signature verified for $IMAGE@$DIGEST"
          docker pull "$IMAGE@$DIGEST"
          capsid test "$TARGET" --image "$IMAGE@$DIGEST"

  catalog:
    needs: [detect, publish, verify]
    if: github.event_name == 'push' && needs.detect.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Capsid CLI
        run: uv tool install "git+https://github.com/LaBiOmicS/capsid.git@${CAPSID_REF}"
      - name: Rebuild catalog and docs
        run: |
          capsid catalog --dir recipes --out catalog.json
          capsid docs --dir recipes --catalog catalog.json --out-dir .
      - name: Commit updated catalog
        run: |
          git config user.name "capsid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json CATALOG.md
          git diff --staged --quiet || (git commit -m "chore(catalog): update central catalog [skip ci]" && git push)

  site:
    needs: [detect, publish, verify]
    if: always() && needs.publish.result == 'success' && needs.verify.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
