<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capsid Hub | Modern BioContainers Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --purple: #bc8cff;
      --yellow: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .subtitle { color: var(--text-muted); font-size: 1.1rem; max-width: 700px; margin: 0 auto 1.5rem; }
    .stats-bar { display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem; }
    .stat-badge { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.9rem; }
    .stat-badge strong { color: var(--accent); }
    .search-box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 2rem;
      position: relative;
    }
    input[type="text"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, border-color 0.15s;
    }
    .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .tool-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; }
    .tool-name { font-size: 1.3rem; font-weight: 600; color: #fff; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-pixi { background: rgba(88, 166, 255, 0.15); color: var(--accent); border: 1px solid var(--accent); }
    .badge-uv { background: rgba(63, 185, 80, 0.15); color: var(--green); border: 1px solid var(--green); }
    .tool-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; min-height: 40px; }
    .versions-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.2rem; }
    .version-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }
    .btn-group { display: flex; gap: 0.5rem; }
    button.btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: background 0.2s;
    }
    button.btn:hover { background: rgba(255, 255, 255, 0.15); }
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--green);
      color: #000;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      display: none;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧬 Capsid Hub</h1>
      <p class="subtitle">Next-generation container factory for bioinformatics. Ultra-slim, hardened rootless OCI and SIF images with native Nextflow & Snakemake integration.</p>
      <div class="stats-bar">
        <div class="stat-badge">Total Tools: <strong id="stat-tools">0</strong></div>
        <div class="stat-badge">Total Recipes: <strong id="stat-recipes">0</strong></div>
        <div class="stat-badge">Engines: <strong>uv (PyPI) &amp; pixi (conda)</strong></div>
        <div class="stat-badge">HPC: <strong>Apptainer & Singularity SIF</strong></div>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="Search tool by name, category, or description (e.g. samtools, bwa, alignment)..." onkeyup="filterTools()">
      </div>
    </header>

    <div class="tool-grid" id="grid"></div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const data = {"version": "1.1.0", "total_tools": 9, "total_recipes": 11, "tools": {"bcftools": {"id": "bcftools", "name": "bcftools", "description": "BCFtools, utilities for manipulating variant calls in VCF and BCF formats.", "homepage": "https://github.com/samtools/bcftools", "license": "GPL-3.0-or-later", "categories": ["bioinformatics", "bioconda-migrated"], "versions": {"1.21": {"version": "1.21", "canonical_tag": "bcftools:1.21", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "bcftools -h", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/bcftools:1.21", "apptainer": "docker://ghcr.io/labiomics/capsid/bcftools:1.21", "nextflow": "ghcr.io/labiomics/capsid/bcftools:1.21", "snakemake": "docker://ghcr.io/labiomics/capsid/bcftools:1.21"}}, "1.25": {"version": "1.25", "canonical_tag": "bcftools:1.25", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "bcftools -h", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/bcftools:1.25", "apptainer": "docker://ghcr.io/labiomics/capsid/bcftools:1.25", "nextflow": "ghcr.io/labiomics/capsid/bcftools:1.25", "snakemake": "docker://ghcr.io/labiomics/capsid/bcftools:1.25"}}}}, "bedtools": {"id": "bedtools", "name": "bedtools", "description": "A powerful toolset for genome arithmetic", "homepage": "http://bedtools.readthedocs.org/", "license": "MIT", "categories": ["bioinformatics", "bioconda-migrated"], "versions": {"2.31.1": {"version": "2.31.1", "canonical_tag": "bedtools:2.31.1", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "bedtools", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/bedtools:2.31.1", "apptainer": "docker://ghcr.io/labiomics/capsid/bedtools:2.31.1", "nextflow": "ghcr.io/labiomics/capsid/bedtools:2.31.1", "snakemake": "docker://ghcr.io/labiomics/capsid/bedtools:2.31.1"}}}}, "bwa": {"id": "bwa", "name": "bwa", "description": "The BWA read mapper.", "homepage": "https://github.com/lh3/bwa", "license": "GPL-3.0-or-later", "categories": ["bioinformatics", "bioconda-migrated"], "versions": {"0.7.19": {"version": "0.7.19", "canonical_tag": "bwa:0.7.19", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "bwa 2>&1 | grep \"index sequences in the\"", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/bwa:0.7.19", "apptainer": "docker://ghcr.io/labiomics/capsid/bwa:0.7.19", "nextflow": "ghcr.io/labiomics/capsid/bwa:0.7.19", "snakemake": "docker://ghcr.io/labiomics/capsid/bwa:0.7.19"}}}}, "cutadapt": {"id": "cutadapt", "name": "cutadapt", "description": "Adapter trimming and other preprocessing of high-throughput sequencing reads", "homepage": "https://pypi.org/project/cutadapt/", "license": "MIT", "categories": ["bioinformatics", "genomics", "python"], "versions": {"5.2": {"version": "5.2", "canonical_tag": "cutadapt:5.2", "build_type": "uv-pypi", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "python -c 'import cutadapt; print(\"cutadapt OK\")'", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/cutadapt:5.2", "apptainer": "docker://ghcr.io/labiomics/capsid/cutadapt:5.2", "nextflow": "ghcr.io/labiomics/capsid/cutadapt:5.2", "snakemake": "docker://ghcr.io/labiomics/capsid/cutadapt:5.2"}}}}, "fastp": {"id": "fastp", "name": "fastp", "description": "A ultra-fast FASTQ preprocessor with full features (QC/adapters/trimming/filtering/splitting...).", "homepage": "https://github.com/OpenGene/fastp", "license": "MIT", "categories": ["bioinformatics", "bioconda-migrated"], "versions": {"1.4.0": {"version": "1.4.0", "canonical_tag": "fastp:1.4.0", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "fastp --help", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/fastp:1.4.0", "apptainer": "docker://ghcr.io/labiomics/capsid/fastp:1.4.0", "nextflow": "ghcr.io/labiomics/capsid/fastp:1.4.0", "snakemake": "docker://ghcr.io/labiomics/capsid/fastp:1.4.0"}}}}, "minimap2": {"id": "minimap2", "name": "minimap2", "description": "A versatile pairwise aligner for genomic and spliced nucleotide sequences.", "homepage": "https://github.com/lh3/minimap2", "license": "MIT", "categories": ["bioinformatics", "bioconda-migrated"], "versions": {"2.28": {"version": "2.28", "canonical_tag": "minimap2:2.28", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "minimap2 2>&1 | grep 'Usage'", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/minimap2:2.28", "apptainer": "docker://ghcr.io/labiomics/capsid/minimap2:2.28", "nextflow": "ghcr.io/labiomics/capsid/minimap2:2.28", "snakemake": "docker://ghcr.io/labiomics/capsid/minimap2:2.28"}}}}, "multiqc": {"id": "multiqc", "name": "multiqc", "description": "Create aggregate bioinformatics analysis reports across many samples and tools", "homepage": "https://pypi.org/project/multiqc/", "license": "GPL-3.0-only", "categories": ["bioinformatics", "genomics", "python"], "versions": {"1.25.1": {"version": "1.25.1", "canonical_tag": "multiqc:1.25.1", "build_type": "uv-pypi", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "python -c 'import multiqc; print(\"multiqc OK\")'", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/multiqc:1.25.1", "apptainer": "docker://ghcr.io/labiomics/capsid/multiqc:1.25.1", "nextflow": "ghcr.io/labiomics/capsid/multiqc:1.25.1", "snakemake": "docker://ghcr.io/labiomics/capsid/multiqc:1.25.1"}}}}, "samtools": {"id": "samtools", "name": "samtools", "description": "Tools for dealing with SAM, BAM and CRAM files", "homepage": "https://github.com/samtools/samtools", "license": "MIT", "categories": ["bioinformatics", "bioconda-migrated"], "versions": {"1.19": {"version": "1.19", "canonical_tag": "samtools:1.19", "build_type": "pixi-conda", "platforms": ["linux/amd64"], "test_command": "samtools --help", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/samtools:1.19", "apptainer": "docker://ghcr.io/labiomics/capsid/samtools:1.19", "nextflow": "ghcr.io/labiomics/capsid/samtools:1.19", "snakemake": "docker://ghcr.io/labiomics/capsid/samtools:1.19"}}, "1.25": {"version": "1.25", "canonical_tag": "samtools:1.25", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "samtools --help", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/samtools:1.25", "apptainer": "docker://ghcr.io/labiomics/capsid/samtools:1.25", "nextflow": "ghcr.io/labiomics/capsid/samtools:1.25", "snakemake": "docker://ghcr.io/labiomics/capsid/samtools:1.25"}}}}, "seqkit": {"id": "seqkit", "name": "seqkit", "description": "A cross-platform and ultrafast toolkit for FASTA/Q file manipulation.", "homepage": "https://github.com/shenwei356/seqkit", "license": "MIT", "categories": ["bioinformatics", "bioconda-migrated"], "versions": {"2.8.2": {"version": "2.8.2", "canonical_tag": "seqkit:2.8.2", "build_type": "pixi-conda", "platforms": ["linux/amd64", "linux/arm64"], "test_command": "seqkit version --help", "hpc_ready": true, "container_uris": {"docker": "docker://ghcr.io/labiomics/capsid/seqkit:2.8.2", "apptainer": "docker://ghcr.io/labiomics/capsid/seqkit:2.8.2", "nextflow": "ghcr.io/labiomics/capsid/seqkit:2.8.2", "snakemake": "docker://ghcr.io/labiomics/capsid/seqkit:2.8.2"}}}}}};
    const tools = data.tools || {};

    document.getElementById('stat-tools').innerText = Object.keys(tools).length;
    document.getElementById('stat-recipes').innerText = data.total_recipes || Object.keys(tools).length;

    function renderTools(filter = '') {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const query = filter.toLowerCase().trim();

      for (const [name, info] of Object.entries(tools)) {
        const desc = info.description || '';
        const match = name.toLowerCase().includes(query) || desc.toLowerCase().includes(query);
        if (!match) continue;

        const versions = Object.keys(info.versions || {});
        const latest = versions[versions.length - 1] || '1.0';
        const latestData = (info.versions && info.versions[latest]) || {};
        const engine = latestData.build_type || 'pixi-conda';

        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
          <div>
            <div class="tool-header">
              <span class="tool-name">${name}</span>
              <span class="badge ${engine.includes('uv') ? 'badge-uv' : 'badge-pixi'}">${engine}</span>
            </div>
            <div class="tool-desc">${desc}</div>
            <div class="versions-list">
              ${versions.map(v => `<span class="version-tag">v${v}</span>`).join('')}
            </div>
          </div>
          <div class="btn-group">
            <button class="btn" onclick="copyNf('${name}', '${latest}')">📋 Nextflow</button>
            <button class="btn" onclick="copySmk('${name}', '${latest}')">🐍 Snakemake</button>
            <button class="btn" onclick="copySif('${name}', '${latest}')">📦 Apptainer</button>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function filterTools() {
      const q = document.getElementById('search').value;
      renderTools(q);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function copyNf(tool, ver) {
      const snippet = `container 'ghcr.io/labiomics/capsid/${tool}:${ver}'`;
      navigator.clipboard.writeText(snippet);
      showToast(`Copied Nextflow directive for ${tool}!`);
    }

    function copySmk(tool, ver) {
      const snippet = `container: "docker://ghcr.io/labiomics/capsid/${tool}:${ver}"`;
      navigator.clipboard.writeText(snippet);
      showToast(`Copied Snakemake directive for ${tool}!`);
    }

    function copySif(tool, ver) {
      const snippet = `apptainer exec docker://ghcr.io/labiomics/capsid/${tool}:${ver} ${tool} --version`;
      navigator.clipboard.writeText(snippet);
      showToast(`Copied Apptainer command for ${tool}!`);
    }

    renderTools();
  </script>
</body>
</html>
