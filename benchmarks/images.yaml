# Images compared on the hub website (Capsid vs other sources).
# Measured with: python3 scripts/compare_images.py benchmarks/images.yaml --out benchmarks/results.json (from LaBiOmicS/capsid)
# BioContainers: the most recently pushed build of the same tool version on quay.io/biocontainers.
# StaPH-B: the tag equal to the tool version on Docker Hub (staphb/<tool>), when it exists.
sources:
  capsid: Capsid
  biocontainers: BioContainers
  staphb: StaPH-B
tools:
  - tool: samtools
    version: "1.25"
    images:
      capsid: ghcr.io/labiomics/capsid/samtools:1.25
      biocontainers: quay.io/biocontainers/samtools:1.25--h9dcdb79_0
  - tool: bwa
    version: "0.7.19"
    images:
      capsid: ghcr.io/labiomics/capsid/bwa:0.7.19
      biocontainers: quay.io/biocontainers/bwa:0.7.19--h577a1d6_1
      staphb: staphb/bwa:0.7.19
  - tool: fastp
    version: "1.4.0"
    images:
      capsid: ghcr.io/labiomics/capsid/fastp:1.4.0
      biocontainers: quay.io/biocontainers/fastp:1.4.0--h43da1c4_0
      staphb: staphb/fastp:1.4.0
  - tool: multiqc
    version: "1.25.1"
    images:
      capsid: ghcr.io/labiomics/capsid/multiqc:1.25.1
      biocontainers: quay.io/biocontainers/multiqc:1.25.1--pyhdfd78af_0
  - tool: minimap2
    version: "2.28"
    images:
      capsid: ghcr.io/labiomics/capsid/minimap2:2.28
      biocontainers: quay.io/biocontainers/minimap2:2.28--h577a1d6_4
      staphb: staphb/minimap2:2.28
  - tool: bcftools
    version: "1.21"
    images:
      capsid: ghcr.io/labiomics/capsid/bcftools:1.21
      biocontainers: quay.io/biocontainers/bcftools:1.21--h3a4d415_1
      staphb: staphb/bcftools:1.21
  - tool: seqkit
    version: "2.8.2"
    images:
      capsid: ghcr.io/labiomics/capsid/seqkit:2.8.2
      biocontainers: quay.io/biocontainers/seqkit:2.8.2--h9ee0642_1
      staphb: staphb/seqkit:2.8.2
  - tool: bedtools
    version: "2.31.1"
    images:
      capsid: ghcr.io/labiomics/capsid/bedtools:2.31.1
      biocontainers: quay.io/biocontainers/bedtools:2.31.1--h13024bc_3
      staphb: staphb/bedtools:2.31.1
  - tool: cutadapt
    version: "5.2"
    images:
      capsid: ghcr.io/labiomics/capsid/cutadapt:5.2
      biocontainers: quay.io/biocontainers/cutadapt:5.2--py312hfabe715_2
